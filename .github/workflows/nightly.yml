name: Nightly

# The full end-to-end suite on three browsers, four shards each (12 jobs, 12 shops), plus the API suite.
# Blob reports from every job are merged into one HTML report, summarised (tests, duration, flaky) and
# published on GitHub Pages: a summary page plus the latest report.
on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: ${{ matrix.project }} ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        include:
          - project: api
            shard: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-playwright
        with:
          # The setup project logs in with Chromium, so every browser job needs it as well.
          browsers: ${{ matrix.project == 'api' && 'chromium' || format('chromium {0}', matrix.project) }}

      - name: Start the shop
        uses: BilokinTaras/shop-sut/.github/actions/start-sut@v1.0.0 # zizmor: ignore[unpinned-uses] same owner; the release tag pairs with image-tag
        with:
          image-tag: v1.0.0

      - name: Playwright
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.project == 'api' && 1 || 4 }}
        run: npx playwright test --project="$PROJECT" --shard="$SHARD/$TOTAL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

      - name: Stand logs on failure
        if: failure()
        uses: BilokinTaras/shop-sut/.github/actions/collect-sut-logs@v1.0.0 # zizmor: ignore[unpinned-uses] same owner, release tag
        with:
          name: shop-sut-logs-${{ matrix.project }}-${{ matrix.shard }}

  report:
    name: Merge reports
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: ''

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          merge-multiple: true
          path: all-blob-reports

      - name: Merge into one HTML and one JSON report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: npx playwright merge-reports --reporter html,json all-blob-reports

      - name: Summary and Pages site
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/ci-summary.mjs results.json --title "Nightly — shop-e2e-playwright" \
            --site site --run-url "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          cp -r playwright-report site/report

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: Publish to Pages
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
